name: Build and Deploy Subdomains React App to S3

on:
  push:
    branches:
      - main   # Change to 'master' if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # 3. Install dependencies & compile React build (inside client folder)
      - name: Install Dependencies and Build
        working-directory: ./client
        run: |
          npm ci
          npm run build

      # 4. Authenticate with AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 5. Deploy to Plus Subdomain (plus.xavier.edu.np)
      - name: Deploy to plus.xavier.edu.np
        run: |
          if [ -d "./client/dist" ]; then
            aws s3 sync ./client/dist s3://plus.xavier.edu.np --delete
          elif [ -d "./client/build" ]; then
            aws s3 sync ./client/build s3://plus.xavier.edu.np --delete
          else
            echo "Error: Neither ./client/dist nor ./client/build directory was found after building."
            exit 1
          fi

      # 6. Deploy to A-Level Subdomain (alevel.xavier.edu.np)
      - name: Deploy to alevel.xavier.edu.np
        run: |
          if [ -d "./client/dist" ]; then
            aws s3 sync ./client/dist s3://alevel.xavier.edu.np --delete
          elif [ -d "./client/build" ]; then
            aws s3 sync ./client/build s3://alevel.xavier.edu.np --delete
          fi
